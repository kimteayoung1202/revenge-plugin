name: Build and Deploy Revenge Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Package plugins
        run: ./gradlew packageAllPlugins

      - name: Generate repository index
        run: >
          bun node_modules/@revenge-mod/plugin-cli/src/main.ts generate-index
          --dist build/dist
          --base-url https://kimteayoung1202.github.io/revenge-plugin/

      - name: Prepare Pages
        run: |
          mkdir -p public
          cp build/dist/*.zip public/
          cp index.json public/
          touch public/.nojekyll

          echo "=== Pages contents ==="
          find public -type f -print

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
