name: Build and Deploy Revenge Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build JS
        run: bun node_modules/@revenge-mod/plugin-cli/src/main.ts build

      - name: Package plugin
        run: |
          mkdir -p build/dist
          mkdir -p build/package

          cp plugins/server-owner/manifest.json build/package/manifest.json
          cp plugins/server-owner/build/js/index.js build/package/index.js

          cd build/package
          zip -r ../dist/dev.kimteayoung1202.server-owner.zip .
          cd ../..

          echo "=== ZIP ==="
          unzip -l build/dist/dev.kimteayoung1202.server-owner.zip

      - name: Generate repository index
        run: >
          bun node_modules/@revenge-mod/plugin-cli/src/main.ts generate-index
          --dist build/dist
          --base-url https://kimteayoung1202.github.io/revenge-plugin/

      - name: Prepare Pages
        run: |
          mkdir -p public
          cp build/dist/*.zip public/
          cp index.json public/
          touch public/.nojekyll

          echo "=== Pages ==="
          find public -type f -print

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
