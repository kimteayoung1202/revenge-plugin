name: Build Revenge Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build plugin
        run: bun run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: server-owner
          path: |
            dist/**
            plugins/server-owner/build/**
          if-no-files-found: warn
