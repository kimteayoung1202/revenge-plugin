name: Build Revenge Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build plugin
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: server-owner
          path: |
            dist/**
            plugins/server-owner/build/**
          if-no-files-found: warn
