name: Build and Deploy Revenge Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build plugins
        run: bun node_modules/@revenge-mod/plugin-cli/src/main.ts build

      - name: Generate repository index
        run: bun node_modules/@revenge-mod/plugin-cli/src/main.ts generate-index

      - name: Prepare Pages
        run: |
          mkdir -p public

          if [ -d dist ]; then
            cp -r dist/. public/
          fi

          if [ -d build ]; then
            cp -r build/. public/
          fi

          if [ -f index.json ]; then
            cp index.json public/
          fi

          touch public/.nojekyll

          echo "=== Pages contents ==="
          find public -maxdepth 4 -type f -print

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
